name: Olympix Integrated Security Workflow

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Olympix Integrated Security
        uses: olympix/integrated-security@main
        env:
          OLYMPIX_API_TOKEN: ${{ secrets.OLYMPIX_API_TOKEN }}
          OLYMPIX_CLI_LOG_LEVEL: 0
        with:
          args: -p ./src/contracts/ --output-format json --output-path ./

      - name: Parse Results and Create Annotations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/parse-olympix.js');
            await script({ github, context, core });
