name: Olympix Integrated Security Workflow

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Olympix Integrated Security
        uses: olympix/integrated-security@main
        env:
          OLYMPIX_API_TOKEN: ${{ secrets.OLYMPIX_API_TOKEN }}
          OLYMPIX_CLI_LOG_LEVEL: 0
        with:
          args: -p ./src/contracts/ --output-format json --output-path ./

      - name: Parse Results and Create Annotations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the JSON output
            let files;
            try {
              const raw = fs.readFileSync('olympix.json', 'utf8');
              files = JSON.parse(raw);
              // Handle if it's wrapped in an object
              if (!Array.isArray(files)) {
                files = files.results || files.files || [files];
              }
            } catch (e) {
              console.log('No results file found or invalid JSON:', e.message);
              return;
            }
            
            // Flatten all bugs from all files
            const allIssues = [];
            for (const file of files) {
              for (const bug of (file.bugs || [])) {
                allIssues.push({
                  path: file.path,
                  ...bug
                });
              }
            }
            
            if (allIssues.length === 0) {
              console.log('No security issues found!');
              
              // Create a passing check
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Olympix Security Scan',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'No security issues found',
                  summary: 'Olympix security scan completed with no issues detected.'
                }
              });
              return;
            }
            
            // Count by severity
            const severityCounts = { High: 0, Medium: 0, Low: 0, Info: 0 };
            allIssues.forEach(i => {
              const sev = i.severity || 'Unknown';
              severityCounts[sev] = (severityCounts[sev] || 0) + 1;
            });
            
            // Build summary comment
            let comment = '## 🔍 Olympix Security Scan Results\n\n';
            comment += `Found **${allIssues.length}** issue(s) across **${files.length}** file(s)\n\n`;
            
            // Severity summary
            comment += '### Summary\n';
            if (severityCounts.High > 0) comment += `- High: ${severityCounts.High}\n`;
            if (severityCounts.Medium > 0) comment += `- Medium: ${severityCounts.Medium}\n`;
            if (severityCounts.Low > 0) comment += `- Low: ${severityCounts.Low}\n`;
            comment += '\n';
            
            // Group issues by file
            comment += '### Details\n\n';
            for (const file of files) {
              if (!file.bugs || file.bugs.length === 0) continue;
              
              comment += `<details>\n<summary><strong>${file.path}</strong> (${file.bugs.length} issues)</summary>\n\n`;
              comment += '| Line | Severity | Confidence | Description |\n';
              comment += '|------|----------|------------|-------------|\n';
              
                
                const description = bug.olympixUrl 
                  ? `[${bug.description}](${bug.olympixUrl})`
                  : bug.description;
                
                comment += `| ${bug.line}:${bug.column} | ${bug.severity} | ${bug.confidence} | ${description} |\n`;
              }
              comment += '\n</details>\n\n';
            }
            
            // Post comment on PR if this is a pull request
            if (context.payload.pull_request) {
              // Check for existing comment to update instead of creating duplicate
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number
              });
              
              const existingComment = comments.find(c => 
                c.user.type === 'Bot' && c.body.includes('Olympix Security Scan Results')
              );
              
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: comment
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: comment
                });
              }
            }
            
            // Create check run with inline annotations
            const annotations = allIssues.slice(0, 50).map(issue => ({
              path: issue.path,
              start_line: issue.line,
              end_line: issue.line,
              start_column: issue.column,
              end_column: issue.column,
              annotation_level: ['Critical', 'High'].includes(issue.severity) ? 'failure' : 'warning',
              message: `[${issue.severity}/${issue.confidence}] ${issue.description}`,
              title: issue.severity + ' - ' + issue.description.split(' ').slice(0, 5).join(' ') + '...'
            }));
            
            const hasFailures = severityCounts.Critical > 0 || severityCounts.High > 0;
            
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Olympix Security Scan',
              head_sha: context.sha,
              status: 'completed',
              conclusion: hasFailures ? 'failure' : 'neutral',
              output: {
                title: `Found ${allIssues.length} issue(s): ${severityCounts.High} high, ${severityCounts.Medium} medium, ${severityCounts.Low} low`,
                summary: comment,
                annotations: annotations
              }
            });
            
            // Fail the workflow if high issues found
            if (hasFailures) {
              core.setFailed(`Found ${severityCounts.High} critical/high severity issues`);
            }
